<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odonata Label Studio</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script></head><body>
<header><h1>Odonata Label Studio</h1><div class="toolbar"><label class="button">Import CSV<input id="csvFile" type="file" accept=".csv,text/csv" hidden></label><button id="loadTemplate">Load Template</button><button id="saveTemplate">Save Template</button><button id="exportCsv">Export Records CSV</button><button class="primary" id="makePdf">Generate Labels PDF</button><input id="templateFile" type="file" accept=".json" hidden></div></header>
<nav><button data-tab="records" class="active">Occurrence Editor</button><button data-tab="layout">Label Layout</button><button data-tab="preview">Preview / Output</button></nav>
<main>
<section id="records" class="tab active"><div class="recordbar"><button id="newRecord">New Record</button><button id="duplicateRecord">Clone Record</button><button id="deleteRecord">Delete</button><span id="recordCount"></span><select id="recordSelect"></select></div><form id="occForm"></form></section>
<section id="layout" class="tab"><div class="bulk"><button id="includeSelected">Include Selected</button><button id="excludeSelected">Exclude Selected</button><button id="selectIncluded">Select Included</button><span>Drag rows by the handle to reorder. The identification block is fixed first.</span></div><div class="tableWrap"><table id="fieldTable"><thead><tr><th></th><th>Use</th><th>Field</th><th>Prefix</th><th>Suffix</th><th>Separator</th><th>New line</th><th>Blank</th><th>Wrap (in)</th><th>Font</th><th>Size</th><th>Word space</th><th>Format</th></tr></thead><tbody></tbody></table></div></section>
<section id="preview" class="tab"><div class="previewTools"><label>Record <select id="previewRecord"></select></label><label><input id="borders" type="checkbox"> cutting borders</label></div><div id="labelPreview" class="label"></div><p class="hint">PDF output is four 5 × 3 inch labels in one centered 6 × 10 inch block, so neighboring labels share cut edges.</p></section>
</main><dialog id="message"><p></p><button onclick="this.closest('dialog').close()">OK</button></dialog><script src="app.js"></script></body></html>
